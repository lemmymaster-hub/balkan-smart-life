name: BSL Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/bsl-flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsl-flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test
